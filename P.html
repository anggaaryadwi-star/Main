<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Affiliate TikTok</title>
    <style>
        /* Background Elegan */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Kotak Utama dengan Efek Kaca */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 95%;
            max-width: 450px;
            padding: 30px 15px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            box-sizing: border-box;
            
            animation: slideUpContainer 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUpContainer {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Foto Profil Utama */
        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 0.9rem;
            color: #cccccc;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        /* TOMBOL PROFIL TIKTOK UTAMA */
        .btn-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-sizing: border-box;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
            margin-bottom: 25px;
            transition: all 0.15s ease;
            position: relative;
            
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease-out forwards;
            animation-delay: 0.1s;
        }

        .btn-profile:active {
            transform: translateY(6px) !important;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Container 2 KOLOM untuk Produk */
        .links-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px; 
        }

        /* Tombol Affiliate Produk */
        .btn-affiliate {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.3;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25); 
            transition: all 0.15s ease;
            position: relative;
            
            opacity: 0; 
            transform: translateY(30px); 
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Efek Bergelombang Produk */
        .btn-affiliate:nth-child(1) { animation-delay: 0.2s; }
        .btn-affiliate:nth-child(2) { animation-delay: 0.25s; }
        .btn-affiliate:nth-child(3) { animation-delay: 0.3s; }
        .btn-affiliate:nth-child(4) { animation-delay: 0.35s; }
        .btn-affiliate:nth-child(5) { animation-delay: 0.4s; }
        .btn-affiliate:nth-child(6) { animation-delay: 0.45s; }
        .btn-affiliate:nth-child(7) { animation-delay: 0.5s; }
        .btn-affiliate:nth-child(8) { animation-delay: 0.55s; }
        .btn-affiliate:nth-child(9) { animation-delay: 0.6s; }
        .btn-affiliate:nth-child(10) { animation-delay: 0.65s; }
        .btn-affiliate:nth-child(11) { animation-delay: 0.7s; }
        .btn-affiliate:nth-child(12) { animation-delay: 0.75s; }
        .btn-affiliate:nth-child(13) { animation-delay: 0.8s; }
        .btn-affiliate:nth-child(14) { animation-delay: 0.85s; }
        .btn-affiliate:nth-child(15) { animation-delay: 0.9s; }
        .btn-affiliate:nth-child(16) { animation-delay: 0.95s; }
        .btn-affiliate:nth-child(17) { animation-delay: 1.0s; }
        .btn-affiliate:nth-child(18) { animation-delay: 1.05s; }
        .btn-affiliate:nth-child(19) { animation-delay: 1.1s; }
        .btn-affiliate:nth-child(20) { animation-delay: 1.15s; }

        .btn-img {
            width: 100%;
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            border-radius: 10px;
            margin-bottom: 8px; 
        }

        .btn-affiliate:active {

            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
